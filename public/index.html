<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Coastal Fresh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/admin/admin.css">
    <link rel="icon" href="/favicon.ico" />
</head>
<body>
    <!-- Initial Loading/Auth Screen -->
    <div id="auth-gate">
        <div class="loading-spinner"></div>
        <p>Authenticating...</p>
    </div>

    <!-- Main App Container (hidden until authenticated) -->
    <div id="admin-app" style="display: none;">
        <header class="admin-header">
            <div class="header-content">
                <h1><i class="fas fa-fish"></i> Coastal Fresh Admin</h1>
                <div class="user-menu">
                    <span id="adminUserName"></span>
                    <button id="adminLogoutBtn" aria-label="Logout"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </header>

        <main class="admin-main">
            <div class="page-title">
                <h2><i class="fas fa-box-open"></i> Orders</h2>
            </div>

            <!-- Filters and Stats -->
            <div class="filters-container">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="orderSearch" placeholder="Search by Order ID, Name, Phone...">
                </div>
                <div class="filter-group">
                    <select id="statusFilter">
                        <option value="all">All Statuses</option>
                        <option value="Pending">Pending</option>
                        <option value="Confirmed">Confirmed</option>
                        <option value="Packed">Packed</option>
                        <option value="Out for Delivery">Out for Delivery</option>
                        <option value="Delivered">Delivered</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                </div>
            </div>

            <!-- Orders List -->
            <div id="orders-list-container">
                <!-- Skeletons/Orders will be injected here -->
            </div>
            <button id="loadMoreBtn" style="display: none;">Load More</button>
        </main>
    </div>

    <!-- Order Detail Modal -->
    <div id="orderDetailModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalOrderId"></h3>
                <button class="modal-close-btn" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Order details will be injected here -->
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <!-- Admin Logic -->
    <script src="/admin/admin.js"></script>
</body>
</html>
