<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Coastal Fresh — Admin (Mobile)</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <div id="admin-app">
    <!-- Login -->
    <div id="login-view" class="center" aria-hidden="false">
      <div class="card" role="dialog" aria-labelledby="login-title">
        <h1 id="login-title">Coastal Fresh — Admin</h1>
        <form id="login-form" autocomplete="on">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required inputmode="email" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required />
          </div>
          <div class="field">
            <button class="btn" type="submit" aria-label="Login"> <i class="fa-solid fa-right-to-bracket"></i> Login</button>
          </div>
          <p id="login-error" class="empty" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-view" class="app" style="display:none">
      <header class="app-header">
        <div class="brand">
          <div class="logo" style="padding: 4px; background: #fff;">
            <img src="https://res.cloudinary.com/dpyniai9l/image/upload/v1755523336/Coastal_Fresh_Logo_2_u4xdfa.png" alt="Coastal Fresh Logo" style="width: 100%; height: 100%; object-fit: contain;">
          </div>
          <div>
            <div style="font-size:0.95rem">Coastal Fresh</div>
            <div style="font-size:.76rem;opacity:.9">Admin</div>
          </div>
        </div>

        <div class="header-actions">
          <div class="avatar" id="admin-avatar">A</div>
          <button id="logout-btn" class="btn-small btn-danger" style="padding:.35rem .6rem" aria-label="Logout">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </header>

      <!-- NEW: Desktop Navigation -->
      <nav class="desktop-nav" role="navigation" aria-label="Main">
        <button data-page="dashboard" class="active"><i class="fa-solid fa-house"></i><span>Home</span></button>
        <button data-page="customers"><i class="fa-solid fa-users"></i><span>Customers</span></button>
        <button data-page="products"><i class="fa-solid fa-box-archive"></i><span>Products</span></button>
        <button id="desktop-refresh-btn"><i class="fa-solid fa-arrows-rotate"></i><span>Refresh</span></button>
      </nav>

      <!-- Stats scroller -->
      <div class="stats-scroll" role="region" aria-label="Quick stats">
        <div class="stat">
          <small>Today's Revenue</small>
          <div class="val" id="daily-revenue">₹0.00</div>
        </div>
        <div class="stat">
          <small>Total Orders</small>
          <div class="val" id="total-orders">0</div>
        </div>
        <div class="stat">
          <small>Pending</small>
          <div class="val" id="pending-orders">0</div>
        </div>
        <div class="stat">
          <small>Completed</small>
          <div class="val" id="completed-orders">0</div>
        </div>
        <div class="stat">
          <small>New Signups</small>
          <div class="val" id="new-signups-today">0</div>
        </div>
        <div class="stat">
          <small>Active Users</small>
          <div class="val" id="active-users-today">0</div>
        </div>
      </div>

      <!-- Filter / segment -->
      <div class="segmented" role="tablist" aria-label="Order status filter">
        <button data-filter="all" class="active" aria-selected="true">All<span class="count"></span></button>
        <button data-filter="Pending">Pending<span class="count"></span></button>
        <button data-filter="Accepted">Accepted<span class="count"></span></button>
        <button data-filter="Out for Delivery">Out for Delivery<span class="count"></span></button>
        <button data-filter="Completed">Completed<span class="count"></span></button>
        <button data-filter="Cancelled">Cancelled<span class="count"></span></button>
      </div>

      <!-- Orders -->
      <div class="orders" id="orders-container" aria-live="polite">
        <div class="empty"><div class="spinner" aria-hidden="true"></div></div>
      </div>

      <!-- NEW: Customers View (initially hidden) -->
      <div id="customers-view" style="display:none; padding: 1rem; flex-direction: column; gap: 1rem;">
        <h2 style="font-size: 1.25rem; font-weight: 700; padding: 0 .5rem;">Manage Customers</h2>
        <div id="customers-container" class="orders" style="padding: 0;"></div>
      </div>

      <!-- NEW: Products View (initially hidden) -->
      <div id="products-view" style="display:none; padding: 1rem; flex-direction: column; gap: 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 .5rem;">
          <h2 style="font-size: 1.25rem; font-weight: 700;">Manage Products</h2>
          <button id="add-new-product-btn" class="btn-small btn-primary"><i class="fa-solid fa-plus"></i> Add Product</button>
        </div>
        <div id="products-container" class="orders" style="padding: 0;"></div>
      </div>

      <!-- NEW: Product Edit/Add Form (initially hidden) -->
      <div id="product-form-view" style="display:none; padding: 1rem; flex-direction: column; gap: 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 .5rem;">
          <h2 id="product-form-title" style="font-size: 1.25rem; font-weight: 700;">Add New Product</h2>
          <button id="back-to-products-btn" class="btn-small"><i class="fa-solid fa-arrow-left"></i> Back</button>
        </div>
        <form id="product-form" class="card" style="padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
          <!-- Fields will be added here by JS for structure, but the form tag is important -->
          <input type="hidden" id="product-id-input">
          <div class="field"><label for="product-name">Name</label><input id="product-name" type="text" required></div>
          <div class="field"><label for="product-desc">Description</label><textarea id="product-desc" rows="3" required></textarea></div>
          <div class="field"><label for="product-category">Category</label><input id="product-category" type="text" required placeholder="e.g., Fish, Prawns, Crabs, Pickles"></div>
          <div class="field">
            <label>Product Image</label>
            <img id="product-image-preview" src="" alt="Image Preview" style="max-width: 100px; max-height: 100px; display: none; margin-bottom: 10px; border-radius: 8px; object-fit: cover;">
            <input id="product-image-upload" type="file" accept="image/*" style="margin-bottom: 8px;">
            <label for="product-image-url" style="font-size: .8rem; color: var(--muted); margin-top: 8px;">Or enter Image URL</label>
            <input id="product-image-url" type="url" placeholder="https://example.com/image.png">
            <progress id="upload-progress" value="0" max="100" style="width: 100%; display: none; margin-top: 10px;"></progress>
          </div>
          <div class="field-row"><div class="field"><label for="product-mrp">MRP (₹)</label><input id="product-mrp" type="number" step="0.01" required></div><div class="field"><label for="product-finalPrice">Final Price (₹)</label><input id="product-finalPrice" type="number" step="0.01" required></div></div>
          <div class="field-row"><div class="field"><label for="product-gross">Gross Wt.</label><input id="product-gross" type="text" required></div><div class="field"><label for="product-net">Net Wt.</label><input id="product-net" type="text" required></div></div>
          <div class="field"><label for="product-available">Available</label><select id="product-available"><option value="true">Yes</option><option value="false">No</option></select></div>
          <div class="form-actions"><button id="delete-product-btn" type="button" class="btn btn-danger" style="display:none;">Delete</button><button type="submit" class="btn btn-primary">Save Product</button></div>
        </form>
      </div>

      <!-- Bottom nav -->
      <nav class="bottom-nav" role="navigation" aria-label="Main">
        <button data-page="dashboard" class="active"><i class="fa-solid fa-house"></i><span>Home</span></button>
        <button data-page="customers"><i class="fa-solid fa-users"></i><span>Customers</span></button>
        <button data-page="products"><i class="fa-solid fa-box-archive"></i><span>Products</span></button>
        <button id="refresh-btn"><i class="fa-solid fa-arrows-rotate"></i><span>Refresh</span></button>
      </nav>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
  <!-- Admin Script -->
  <script src="/admin.js" type="module"></script>
</body>
</html>
