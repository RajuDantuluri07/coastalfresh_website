<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Coastal Fresh — Admin (Mobile)</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <div id="admin-app">
    <!-- Login -->
    <div id="login-view" class="center" aria-hidden="false">
      <div class="card" role="dialog" aria-labelledby="login-title">
        <h1 id="login-title">Coastal Fresh — Admin</h1>
        <form id="login-form" autocomplete="on">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required inputmode="email" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required />
          </div>
          <div class="field">
            <button class="btn" type="submit" aria-label="Login"> <i class="fa-solid fa-right-to-bracket"></i> Login</button>
          </div>
          <p id="login-error" class="empty" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-view" class="app" style="display:none">
      <header class="app-header">
        <div class="brand">
          <div class="logo" style="padding: 4px; background: #fff;">
            <img src="https://res.cloudinary.com/dpyniai9l/image/upload/v1755523336/Coastal_Fresh_Logo_2_u4xdfa.png" alt="Coastal Fresh Logo" style="width: 100%; height: 100%; object-fit: contain;">
          </div>
          <div>
            <div style="font-size:0.95rem">Coastal Fresh</div>
            <div style="font-size:.76rem;opacity:.9">Admin</div>
          </div>
        </div>

        <div class="header-actions">
          <div class="avatar" id="admin-avatar">A</div>
          <button id="logout-btn" class="btn-small btn-danger" style="padding:.35rem .6rem" aria-label="Logout">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </header>

      <!-- Stats scroller -->
      <div class="stats-scroll" role="region" aria-label="Quick stats">
        <div class="stat">
          <small>Today's Revenue</small>
          <div class="val" id="daily-revenue">₹0.00</div>
        </div>
        <div class="stat">
          <small>Total Orders</small>
          <div class="val" id="total-orders">0</div>
        </div>
        <div class="stat">
          <small>Pending</small>
          <div class="val" id="pending-orders">0</div>
        </div>
        <div class="stat">
          <small>Completed</small>
          <div class="val" id="completed-orders">0</div>
        </div>
        <div class="stat">
          <small>New Signups</small>
          <div class="val" id="new-signups-today">0</div>
        </div>
        <div class="stat">
          <small>Active Users</small>
          <div class="val" id="active-users-today">0</div>
        </div>
      </div>

      <!-- Filter / segment -->
      <div class="segmented" role="tablist" aria-label="Order status filter">
        <button data-filter="all" class="active" aria-selected="true">All<span class="count"></span></button>
        <button data-filter="Pending">Pending<span class="count"></span></button>
        <button data-filter="Accepted">Accepted<span class="count"></span></button>
        <button data-filter="Out for Delivery">Out for Delivery<span class="count"></span></button>
        <button data-filter="Completed">Completed<span class="count"></span></button>
        <button data-filter="Cancelled">Cancelled<span class="count"></span></button>
      </div>

      <!-- Orders -->
      <div class="orders" id="orders-container" aria-live="polite">
        <div class="empty"><div class="spinner" aria-hidden="true"></div></div>
      </div>

      <!-- Bottom nav -->
      <nav class="bottom-nav" role="navigation" aria-label="Main">
        <button data-page="dashboard" class="active"><i class="fa-solid fa-house"></i><span>Home</span></button>
        <button id="refresh-btn"><i class="fa-solid fa-arrows-rotate"></i><span>Refresh</span></button>
      </nav>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <!-- Admin Script -->
  <script src="/admin.js" type="module"></script>
</body>
</html>
