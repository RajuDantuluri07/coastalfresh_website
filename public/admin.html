<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coastal Fresh - Admin Panel</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/admin.css">
</head>
<body>
    <div id="admin-app">
        <!-- Login View -->
        <div id="login-view" class="view">
            <div class="login-container">
                <h1>Admin Panel</h1>
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit">Login</button>
                    <p id="login-error" class="error-message"></p>
                </form>
            </div>
        </div>

        <!-- NEW Dashboard View -->
        <div id="dashboard-view" class="dashboard" style="display: none;">
            <!-- Sidebar -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h2>🐟 Coastal Fresh</h2>
                    <p>Admin Dashboard</p>
                </div>
                <nav class="sidebar-nav">
                    <a href="#" class="nav-item active" data-page="dashboard">
                        <i class="fas fa-tachometer-alt"></i>
                        Dashboard
                    </a>
                </nav>
            </aside>

            <!-- Main Content -->
            <main class="main-content" id="main-content">
                <header class="main-header">
                    <div class="header-left">
                        <h1 class="page-title">Dashboard</h1>
                    </div>
                    <div class="header-right">
                        <div class="admin-info">
                            <div class="admin-avatar" id="admin-avatar">A</div>
                            <div class="admin-details">
                                <span id="admin-email">admin@coastalfresh.com</span>
                            </div>
                        </div>
                        <button class="logout-btn" id="logout-btn">
                            <i class="fas fa-sign-out-alt"></i>
                            Logout
                        </button>
                    </div>
                </header>

                <div class="content-area">
                    <!-- Stats Grid -->
                    <div class="stats-grid">
                        <div class="stat-card revenue">
                            <div class="stat-header">
                                <span class="stat-title">Today's Revenue</span>
                                <div class="stat-icon">
                                    <i class="fas fa-rupee-sign"></i>
                                </div>
                            </div>
                            <div class="stat-value" id="daily-revenue">₹0.00</div>
                        </div>

                        <div class="stat-card orders">
                            <div class="stat-header">
                                <span class="stat-title">Total Orders</span>
                                <div class="stat-icon">
                                    <i class="fas fa-shopping-bag"></i>
                                </div>
                            </div>
                            <div class="stat-value" id="total-orders">0</div>
                        </div>

                        <div class="stat-card pending">
                            <div class="stat-header">
                                <span class="stat-title">Pending Orders</span>
                                <div class="stat-icon">
                                    <i class="fas fa-clock"></i>
                                </div>
                            </div>
                            <div class="stat-value" id="pending-orders">0</div>
                        </div>

                        <!-- NEW: New Sign-ups Today Card -->
                        <div class="stat-card new-signups">
                            <div class="stat-header">
                                <span class="stat-title">New Sign-ups Today</span>
                                <div class="stat-icon">
                                    <i class="fas fa-user-plus"></i>
                                </div>
                            </div>
                            <div class="stat-value" id="new-signups-today">0</div>
                        </div>

                        <!-- NEW: Daily Active Users Card -->
                        <div class="stat-card active-users">
                            <div class="stat-header">
                                <span class="stat-title">Daily Active Users</span>
                                <div class="stat-icon">
                                    <i class="fas fa-chart-line"></i>
                                </div>
                            </div>
                            <div class="stat-value" id="active-users-today">0</div>
                        </div>

                        <div class="stat-card customers">
                            <div class="stat-header">
                                <span class="stat-title">Total Customers</span>
                                <div class="stat-icon">
                                    <i class="fas fa-users"></i>
                                </div>
                            </div>
                            <div class="stat-value" id="total-customers">0</div>
                        </div>

                        <div class="stat-card completed">
                            <div class="stat-header">
                                <span class="stat-title">Completed Orders</span>
                                <div class="stat-icon">
                                    <i class="fas fa-check-circle"></i>
                                </div>
                            </div>
                            <div class="stat-value" id="completed-orders">0</div>
                        </div>
                    </div>

                    <!-- Orders Section -->
                    <div class="orders-section">
                        <div class="section-header">
                            <h2 class="section-title">Recent Orders</h2>
                            <div class="filters">
                                <select class="filter-select" id="status-filter">
                                    <option value="all">All Status</option>
                                    <option value="Pending">Pending</option>
                                    <option value="Accepted">Accepted</option>
                                    <option value="Out for Delivery">Out for Delivery</option>
                                    <option value="Completed">Completed</option>
                                    <option value="Cancelled">Cancelled</option>
                                </select>
                            </div>
                        </div>
                        <div class="orders-container" id="orders-container">
                            <!-- Orders will be injected here by JS -->
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <!-- Admin Script -->
    <script src="/admin.js" type="module"></script>
</body>
</html>
